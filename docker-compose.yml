version: '3.8'

services:
  # Local development stand-in for Supabase Postgres (PostGIS included).
  # In production the app talks to Supabase Postgres directly via
  # PG_CONNECTION_STRING — no docker needed.
  postgis:
    image: postgis/postgis:15-3.3
    container_name: landvision-postgis
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=landvision_gis

volumes:
  postgres-data:
